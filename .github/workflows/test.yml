name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: plugin tests
        working-directory: plugin
        run: npm test
      - name: tools tests
        run: node --test tools/*.test.mjs

  android-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android fullscreen lifecycle (host stubs, not device acceptance)
        run: python3 android/test/fullscreen-lifecycle.py
